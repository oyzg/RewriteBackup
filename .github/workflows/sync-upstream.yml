name: Sync Yu9191 Rewrite

on:
  push:
    paths:
      - ".github/workflows/sync-upstream.yml"
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select backup source
        id: source
        shell: bash
        run: |
          rm -rf /tmp/upstream /tmp/seed

          if git clone --depth=1 https://github.com/Yu9191/Rewrite.git /tmp/upstream; then
            echo "path=/tmp/upstream" >> "$GITHUB_OUTPUT"
            echo "kind=upstream" >> "$GITHUB_OUTPUT"
            git -C /tmp/upstream rev-parse HEAD > /tmp/source-commit
            exit 0
          fi

          if [ -f .upstream-commit ]; then
            echo "Upstream Yu9191/Rewrite is unavailable; preserving the existing backup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream is unavailable. Seeding the first snapshot from wangyuyan666/QuanxBackup."
          git clone --depth=1 https://github.com/wangyuyan666/QuanxBackup.git /tmp/seed
          echo "path=/tmp/seed/Rewrite(Yu9191)" >> "$GITHUB_OUTPUT"
          echo "kind=seed-from-QuanxBackup" >> "$GITHUB_OUTPUT"
          git -C /tmp/seed rev-parse HEAD > /tmp/source-commit

      - name: Sync files and rewrite raw self-references
        if: steps.source.outputs.skip != 'true'
        shell: bash
        run: |
          SOURCE="${{ steps.source.outputs.path }}"
          SOURCE_KIND="${{ steps.source.outputs.kind }}"

          cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$SOURCE/" ./

          mkdir -p .github/workflows
          cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml

          python3 - <<'PY'
          from pathlib import Path

          old = b"https://raw.githubusercontent.com/Yu9191/Rewrite"
          new = b"https://raw.githubusercontent.com/oyzg/RewriteBackup"

          changed = 0
          for p in Path(".").rglob("*"):
              if not p.is_file() or ".git" in p.parts:
                  continue
              data = p.read_bytes()
              if old in data:
                  p.write_bytes(data.replace(old, new))
                  changed += 1

          print(f"Rewrote raw self-references in {changed} files.")
          PY

          cp /tmp/source-commit .upstream-commit
          printf '%s\n' "$SOURCE_KIND" > .backup-source

      - name: Commit synced changes
        if: steps.source.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git restore --staged .github/workflows/sync-upstream.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi

          SOURCE_SHA="$(cat .upstream-commit)"
          SOURCE_KIND="$(cat .backup-source)"
          git commit -m "sync: ${SOURCE_KIND} @ ${SOURCE_SHA:0:7}"
          git push
